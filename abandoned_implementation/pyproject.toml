[project]
name = "misinformation-abm"
version = "0.1.0"
description = "Agent-based model of misinformation diffusion on scale-free networks"
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "mesa>=3.5,<4",
    "networkx>=3.6,<4",
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "matplotlib>=3.11,<4",
    "salib>=1.5.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.15,<1",
]

[project.scripts]
misinfo-abm = "misinfo_abm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misinfo_abm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
